name: Build iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: Xcode 云端构建（真机 SDK，免签名）
        run: |
          xcodebuild \
            -project SimpleChat.xcodeproj \
            -scheme SimpleChat \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            | tail -40

      - name: 打包 IPA（Payload 目录 + zip）
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SimpleChat.app Payload/
          zip -r SimpleChat-unsigned.ipa Payload
          ls -lh SimpleChat-unsigned.ipa

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: SimpleChat-unsigned-ipa
          path: SimpleChat-unsigned.ipa
          retention-days: 30
